<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pocket - จัดการเงินส่วนตัว</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-card {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .balance-card h2 { margin: 0 0 10px 0; font-size: 1.2rem; opacity: 0.9; }
        .balance-card h1 { margin: 0; font-size: 3rem; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h3 { margin-top: 0; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        
        /* ฟอร์มและปุ่ม */
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: 0.2s;
        }
        .btn-income { background-color: #4CAF50; color: white; }
        .btn-expense { background-color: #f44336; color: white; margin-top: 10px;}
        button:hover { opacity: 0.9; }

        /* กระเป๋าเงิน (Pockets) */
        .pocket-item {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .pocket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .pocket-name { font-weight: bold; font-size: 1.1rem; }
        .pocket-amount { color: #2196F3; font-weight: bold; font-size: 1.2rem; }
        .add-to-pocket {
            display: flex;
            gap: 10px;
        }
        .add-to-pocket input { margin-bottom: 0; }
        .add-to-pocket button { background-color: #2196F3; color: white; width: auto; white-space: nowrap; }

        /* ประวัติ */
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .text-green { color: #4CAF50; font-weight: bold; }
        .text-red { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💰 จัดการเงินส่วนตัว</h1>
    </div>

    <!-- ยอดเงินคงเหลือปัจจุบัน -->
    <div class="balance-card">
        <h2>ยอดเงินที่ใช้ได้ปัจจุบัน (บาท)</h2>
        <h1 id="total-balance">0.00</h1>
    </div>

    <div class="grid">
        <!-- ฝั่งซ้าย: บันทึกรายรับ-รายจ่าย -->
        <div class="card">
            <h3>📝 บันทึกรายการ</h3>
            <label>ชื่อรายการ (เช่น เงินเดือน, ค่าอาหาร)</label>
            <input type="text" id="desc" placeholder="ระบุชื่อรายการ">
            
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="amount" placeholder="0.00">
            
            <button class="btn-income" onclick="addTransaction('income')">+ เพิ่มรายรับ</button>
            <button class="btn-expense" onclick="addTransaction('expense')">- เพิ่มรายจ่าย</button>

            <h3 style="margin-top: 30px;">ประวัติล่าสุด</h3>
            <ul class="history-list" id="history-list">
                <!-- ประวัติจะมาแสดงตรงนี้ -->
            </ul>
        </div>

        <!-- ฝั่งขวา: กระเป๋าเงินสำหรับเก็บออม -->
        <div class="card">
            <h3>💼 กระเป๋าเงิน (Pockets)</h3>
            <p style="font-size: 0.85rem; color: #666; margin-top: -10px;">
                * การโอนเงินเข้ากระเป๋า จะหักเงินจาก "ยอดเงินที่ใช้ได้ปัจจุบัน"
            </p>
            
            <!-- กระเป๋า: ไปเที่ยว -->
            <div class="pocket-item">
                <div class="pocket-header">
                    <span class="pocket-name">✈️ ไปเที่ยว</span>
                    <span class="pocket-amount" id="pocket-travel-amount">0.00 ฿</span>
                </div>
                <div class="add-to-pocket">
                    <input type="number" id="travel-input" placeholder="จำนวนเงิน">
                    <button onclick="addToPocket('travel')">เก็บเงิน</button>
                </div>
            </div>

            <!-- กระเป๋า: เก็บออม -->
            <div class="pocket-item">
                <div class="pocket-header">
                    <span class="pocket-name">🐷 เงินออมฉุกเฉิน</span>
                    <span class="pocket-amount" id="pocket-savings-amount">0.00 ฿</span>
                </div>
                <div class="add-to-pocket">
                    <input type="number" id="savings-input" placeholder="จำนวนเงิน">
                    <button onclick="addToPocket('savings')">เก็บเงิน</button>
                </div>
            </div>
            
            <!-- กระเป๋า: ช้อปปิ้ง -->
            <div class="pocket-item">
                <div class="pocket-header">
                    <span class="pocket-name">🛍️ ช้อปปิ้ง</span>
                    <span class="pocket-amount" id="pocket-shopping-amount">0.00 ฿</span>
                </div>
                <div class="add-to-pocket">
                    <input type="number" id="shopping-input" placeholder="จำนวนเงิน">
                    <button onclick="addToPocket('shopping')">เก็บเงิน</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ตัวแปรเก็บข้อมูล
    let balance = 0;
    let pockets = {
        travel: 0,
        savings: 0,
        shopping: 0
    };

    // ฟังก์ชันอัปเดตหน้าจอ
    function updateUI() {
        document.getElementById('total-balance').innerText = balance.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('pocket-travel-amount').innerText = pockets.travel.toLocaleString('th-TH', {minimumFractionDigits: 2}) + ' ฿';
        document.getElementById('pocket-savings-amount').innerText = pockets.savings.toLocaleString('th-TH', {minimumFractionDigits: 2}) + ' ฿';
        document.getElementById('pocket-shopping-amount').innerText = pockets.shopping.toLocaleString('th-TH', {minimumFractionDigits: 2}) + ' ฿';
    }

    // ฟังก์ชันเพิ่มรายรับ/รายจ่าย
    function addTransaction(type) {
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const desc = descInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (desc === '' || isNaN(amount) || amount <= 0) {
            alert('กรุณากรอกชื่อรายการและจำนวนเงินให้ถูกต้อง');
            return;
        }

        if (type === 'income') {
            balance += amount;
            addHistory(desc, amount, 'income');
        } else if (type === 'expense') {
            if (balance >= amount) {
                balance -= amount;
                addHistory(desc, amount, 'expense');
            } else {
                alert('เงินในกระเป๋าหลักไม่พอสำหรับรายจ่ายนี้!');
                return;
            }
        }

        // ล้างค่าในช่องกรอก
        descInput.value = '';
        amountInput.value = '';
        updateUI();
    }

    // ฟังก์ชันโอนเงินเข้ากระเป๋าย่อย (Pockets)
    function addToPocket(pocketId) {
        const inputElement = document.getElementById(`${pocketId}-input`);
        const amount = parseFloat(inputElement.value);

        if (isNaN(amount) || amount <= 0) {
            alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
            return;
        }

        if (balance >= amount) {
            balance -= amount; // หักจากเงินหลัก
            pockets[pocketId] += amount; // เพิ่มในกระเป๋าย่อย
            
            // เพิ่มประวัติ
            let pocketName = pocketId === 'travel' ? 'ไปเที่ยว' : (pocketId === 'savings' ? 'เงินออม' : 'ช้อปปิ้ง');
            addHistory(`โอนเข้ากระเป๋า: ${pocketName}`, amount, 'expense');
            
            inputElement.value = '';
            updateUI();
        } else {
            alert('ยอดเงินที่ใช้ได้ปัจจุบันของคุณไม่เพียงพอ!');
        }
    }

    // ฟังก์ชันเพิ่มประวัติรายการลงใน List
    function addHistory(desc, amount, type) {
        const historyList = document.getElementById('history-list');
        const li = document.createElement('li');
        li.className = 'history-item';
        
        const sign = type === 'income' ? '+' : '-';
        const colorClass = type === 'income' ? 'text-green' : 'text-red';
        
        li.innerHTML = `
            <span>${desc}</span>
            <span class="${colorClass}">${sign}${amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
        `;
        
        // แทรกรายการใหม่ไว้บนสุด
        historyList.insertBefore(li, historyList.firstChild);
    }

    // เรียกใช้ครั้งแรกเพื่ออัปเดตหน้าจอให้เป็น 0.00
    updateUI();
</script>

</body>
</html>
